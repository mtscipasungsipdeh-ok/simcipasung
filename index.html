<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B4332">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIMCipasung">

  <title>SIMCipasung - MTs Cipasung</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0B2219 0%, #1B4332 60%, #2D6A4F 100%);
      color: #FFFFFF;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .launcher-card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(216, 243, 220, 0.28);
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .app-logo {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      background: #FFFFFF;
      padding: 6px;
      margin: 0 auto 16px;
      display: block;
      object-fit: contain;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { font-size: 13.5px; color: #D8F3DC; margin-bottom: 24px; line-height: 1.45; }
    .btn {
      display: block;
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
      transition: transform 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-open {
      background: #FFFFFF;
      color: #1B4332;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    }
    .btn-install {
      background: #40916C;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: none;
    }
    .hint-box {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 12px;
      color: #B7E4C7;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="launcher-card">
    <img src="./icon-192.png" alt="Logo SIMCipasung" class="app-logo" onerror="this.style.display='none'">
    <h1>SIMCipasung</h1>
    <div class="subtitle">Sistem Informasi Manajemen<br>Madrasah Tsanawiyah Cipasung</div>

    <a id="btn-open-app" href="https://script.google.com/macros/s/AKfycbwDPcuUMttnoHoS3vp8WWp0r4sXqoFGQ4KCJHvsg7dMvL-a9AI6GBJIqlExpx-B2FzC/exec" class="btn btn-open">
      Masuk ke Aplikasi SIMCipasung
    </a>

    <button type="button" id="btn-install-pwa" class="btn btn-install">
      + Instal ke Layar Utama HP
    </button>

    <div class="hint-box" id="status-hint">
      Untuk memasang ikon di HP Android: ketuk menu <strong>&#8942;</strong> di pojok kanan atas Chrome, lalu pilih <strong>Tambahkan ke layar utama / Instal aplikasi</strong>.
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwDPcuUMttnoHoS3vp8WWp0r4sXqoFGQ4KCJHvsg7dMvL-a9AI6GBJIqlExpx-B2FzC/exec';

    // Daftarkan Service Worker agar memenuhi syarat PWA Android
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function() {});
      });
    }

    // Jika dibuka dari ikon layar utama (mode aplikasi standalone), langsung buka SIMCipasung
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (isStandalone) {
      document.getElementById('status-hint').textContent = 'Membuka SIMCipasung...';
      setTimeout(function() {
        window.location.replace(GAS_WEB_APP_URL);
      }, 400);
    }

    // Tampilkan tombol Instal otomatis jika Chrome mendukung prompt langsung
    let deferredPrompt = null;
    const btnInstall = document.getElementById('btn-install-pwa');

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'block';
    });

    btnInstall.addEventListener('click', async function() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      if (choice.outcome === 'accepted') {
        btnInstall.style.display = 'none';
      }
      deferredPrompt = null;
    });
  </script>
</body>
</html>
